[package]
name = "livox-sdk2-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raw FFI bindings to the Livox SDK2 (HAP / Mid-360). The official C++ SDK is vendored and compiled from source at build time."
repository.workspace = true
rust-version.workspace = true
categories = ["api-bindings", "hardware-support"]
keywords = ["livox", "lidar", "sdk", "ffi", "bindings"]
links = "livox_lidar_sdk"
build = "build.rs"

[dependencies]

[build-dependencies]
bindgen = "0.71"
cc = "1"

[lib]
name = "livox_sdk2_sys"
path = "src/lib.rs"
